name: Android DWG viewer

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-36' 'ndk;27.3.13750724' 'cmake;3.31.5'
      - name: Build APK and run scene tests
        run: |
          chmod +x gradlew
          build_status=0
          ./gradlew :app:assembleDebug :app:testDebugUnitTest --console=plain > gradle-build.log 2>&1 || build_status=$?
          if [ "$build_status" -ne 0 ]; then
            echo 'Gradle error lines:'
            grep -nE '(^e: |error:|FAILURE:|BUILD FAILED|Execution failed for task|What went wrong:)' gradle-build.log | tail -n 40 || true
            echo 'Last 100 build log lines:'
            tail -n 100 gradle-build.log
            exit "$build_status"
          fi
          tail -n 30 gradle-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: dwg-viewer-debug
          path: app/build/outputs/apk/debug/*.apk

